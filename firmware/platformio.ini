; Wand firmware for the Hack the North 2026 Hacker Badge (ESP32-C3-MINI-1-N4, 4 MB flash).
; Implements BADGE-FIRMWARE-CONTRACT.md v1: a BLE GATT peripheral that streams 50 Hz acceleration
; to Chrome (Web Bluetooth) and shows the game's feedback on the badge.
; Arduino core 3.x (ESP-IDF 5.x) via the pioarduino platform, NimBLE for the GATT server.
;   pio run                 build   (run from PowerShell, see README.md)
;   pio run -t upload       flash over USB-C (badge on, IDE tab closed so the port is free)
;   pio device monitor      serial console (115200)
[env:badge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_badge.csv
; The badge's flash runs DIO at 80 MHz (official custom-flash guide; the stock boot log says "flash io: dio").
; The devkitm-1 board default is QIO, which this module's flash may not boot from.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Wall
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.3.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
