; Wand firmware for the Hack the North 2026 Hacker Badge (ESP32-C3-MINI-1-N4, 4 MB flash).
; Gameplay image of BADGE-FIRMWARE-CONTRACT.md v1: a BLE GATT peripheral streaming native 50 Hz
; acceleration to Chrome (Web Bluetooth). The boot-selected profile sets INFO capabilities (0x0F on
; the gameplay rows, 0 on the diagnostic rows) and the badge shows the game's feedback.
; Arduino core 3.x (ESP-IDF 5.x) via the pioarduino platform, NimBLE for the GATT server.
; Build from this directory (PlatformIO Core >= 6.2.0 is required; same command in macOS shells and PowerShell):
;   uv run --python 3.12 --with "platformio>=6.2.0" pio run -e badge
; Never `pio run -t upload` on a badge: it writes the bootloader and partition table too. Install the app slot
; only with the separately approved `tools/badge_flash.py flash` (guarded, readback-verified; see README.md).
;   pio device monitor      serial console (115200); or tools/badge_flash.py monitor
[env:badge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_badge.csv
; The badge's flash runs DIO at 80 MHz (official custom-flash guide; the stock boot log says "flash io: dio").
; The devkitm-1 board default is QIO, which this module's flash may not boot from.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -include $PROJECT_DIR/include/nimble_build_config.h
    -Wall
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
    adafruit/Adafruit NeoPixel @ 1.15.5
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
lib_ignore =
    Adafruit seesaw Library
    SD
