; Phantom Arena native firmware for the Hack the North 2026 Hacker Badge (ESP32-C3-MINI-1-N4, 4 MB flash).
; Arduino core 3.x (ESP-IDF 5.x) via the pioarduino platform, so ESP-NOW receive callbacks carry RSSI.
;   pio run                 build
;   pio run -t upload       flash over USB-C (badge on, IDE tab closed so the port is free)
;   pio device monitor      serial console (115200)
[env:badge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Wall
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
