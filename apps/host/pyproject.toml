[project]
name = "phantom-host"
version = "0.1.0"
description = "Authoritative host for the Phantom Arena badge duel"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pyserial==3.5",
    "opencv-contrib-python==4.10.0.84",
    "numpy==2.1.3",
    "openai==1.59.6",
    "websockets==14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "pytest-timeout==2.3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phantom_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No test should ever hang the suite; a blocking worker loop once did.
timeout = 30
asyncio_default_fixture_loop_scope = "function"
